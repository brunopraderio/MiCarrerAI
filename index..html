<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#16222F; --muted:#5A6978; --line:#D8E0E8; --soft:#F5F8FB;
  --m-LM:#F3D27A; --m-TC:#F2A065; --m-SCP:#E27C7C; --m-M:#5A8DEE; --m-PI:#93BDEA; --m-none:#B9C3CD;
  --on-m:#16222F;
  --st-ap-bg:#D9EFDF; --st-ap:#1D5A33;
  --st-cur-bg:#DAE7FB; --st-cur:#1F4C9A;
  --st-ex-bg:#FBE6C4; --st-ex:#7A4A05;
  --st-pen-bg:#E6EBF0; --st-pen:#4B5967;
  --focus:#2F6FE0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --surface:#17222E; --ink:#E9EFF5; --muted:#92A2B2; --line:#2A3847; --soft:#1C2937;
    --m-LM:#D9B85A; --m-TC:#E08C4F; --m-SCP:#CF6767; --m-M:#4C7BD6; --m-PI:#7AA6D6; --m-none:#5B6874;
    --st-ap-bg:#1C3A29; --st-ap:#8FD6A8; --st-cur-bg:#1D3355; --st-cur:#9CC0F5;
    --st-ex-bg:#493712; --st-ex:#F0C77C; --st-pen-bg:#2A3643; --st-pen:#A9B7C5;
    --focus:#7BA7F5;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#17222E; --ink:#E9EFF5; --muted:#92A2B2; --line:#2A3847; --soft:#1C2937;
  --m-LM:#D9B85A; --m-TC:#E08C4F; --m-SCP:#CF6767; --m-M:#4C7BD6; --m-PI:#7AA6D6; --m-none:#5B6874;
  --st-ap-bg:#1C3A29; --st-ap:#8FD6A8; --st-cur-bg:#1D3355; --st-cur:#9CC0F5;
  --st-ex-bg:#493712; --st-ex:#F0C77C; --st-pen-bg:#2A3643; --st-pen:#A9B7C5;
  --focus:#7BA7F5;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header.top{padding:20px 0 10px}
header.top h1{font-size:26px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none}
header.top p{margin:2px 0 0;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.hero .big{font:700 56px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.hero .big span{font-size:22px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero p{margin:8px 0 14px;color:var(--muted)}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;border-right:2px solid var(--surface)}
.stack i:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h2{font-size:18px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mod{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.mod .n{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.mod .v{font:700 24px/1.1 "Bricolage Grotesque",sans-serif;margin:6px 0 8px}
.mod .v small{font:500 13px "Public Sans",sans-serif;color:var(--muted)}
.chip{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:7px;background:var(--c);color:var(--on-m);font-weight:600;font-size:13px}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ink));border-radius:5px}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.cyc{border-top:1px solid var(--line);padding:14px 0}
.cyc:first-of-type{border-top:0;padding-top:0}
.cyc:last-child{padding-bottom:0}
.cyc .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cyc .hd b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.two{display:grid;gap:10px 18px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.two{grid-template-columns:1fr}.hero .big{font-size:46px}}
.lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.lbl span:last-child{color:var(--muted)}
.alert{background:var(--st-ex-bg);color:var(--st-ex);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.sem{margin-bottom:22px}
.sem .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.sem .hd h2{margin:0}
.tog{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;text-align:left}
.tog::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-3px 4px 0 2px;transition:transform .15s}
.tog[aria-expanded="false"]::before{transform:rotate(-45deg);margin:0 4px 0 0}
@media (prefers-reduced-motion:reduce){.tog::before{transition:none}}
.sem .hd span{font-size:13px;color:var(--muted)}
.row{width:100%;display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;margin-bottom:8px;overflow:hidden}
.row .stripe{align-self:stretch;background:var(--c)}
.row .main b{display:block;font-weight:600}
.row .main small{display:block;color:var(--muted);font-size:13px}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .fin{font:700 20px/1 "Bricolage Grotesque",sans-serif;min-width:24px;text-align:right}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.st-ap,.st-exa{background:var(--st-ap-bg);color:var(--st-ap)}
.tries{font-size:11px;color:var(--muted)}
.tries-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.tries-row[hidden]{display:none}
.stp{display:inline-flex;align-items:center;gap:8px}
.stp .btn{padding:2px 12px;font-size:15px;line-height:1.5}
.stp output{min-width:20px;text-align:center;font-weight:600;color:var(--ink)}
.st-cur{background:var(--st-cur-bg);color:var(--st-cur)}
.st-ex{background:var(--st-ex-bg);color:var(--st-ex)}
.st-pen{background:var(--st-pen-bg);color:var(--st-pen)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:#B3261E;border-color:currentColor}
.btn.add{width:100%;border-style:dashed;color:var(--muted);background:transparent}
.empty{color:var(--muted);font-size:14px;margin:0 0 8px}
a{color:var(--focus)}
.req{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.req li{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.req .pill{text-align:center}
.req b{display:block;font-weight:600}
.req small{color:var(--muted);font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,18,26,.55)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{margin:0}
.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f select:disabled{opacity:.45;cursor:not-allowed}
.f.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px}
.f.chk input{width:auto;margin:0}
.addrow{display:flex;gap:8px}
.addrow .btn.add{width:auto;flex:1}
.btn:disabled{opacity:.5;cursor:default}
.pk{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto;min-height:0}
.pi{flex:none;display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 0;overflow:hidden}
.pi .stripe{align-self:stretch;background:var(--c)}
.pi b{display:block;font-weight:600;font-size:14px}
.pi small{display:block;color:var(--muted);font-size:12.5px}
.pi .btn{padding:6px 12px;font-size:14px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.acts .sp{margin-right:auto}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.cfg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function clean(d){
  if(!d.cfg.orientMin) d.cfg.orientMin = {pro:16, gra:16};
  if(!d.v || d.v < 2){
    const g = d.cfg.cycles && d.cfg.cycles.gra;
    if(g && g.obl === 60 && g.opt === 75){ g.obl = 20; g.opt = 115; }
    d.subjects.forEach(s => { if(s.name === 'TFG' && s.type === 'obl') s.type = 'opt'; });
    d.v = 2;
  }
  if(d.v < 3){
    d.subjects.forEach(s => { if(s.name === 'TFG') s.tfg = true; });
    d.v = 3;
  }
  if(d.v < 4){
    d.subjects.forEach(s => {
      if(s.status === 'pen' && s.name === 'Seminario de TFG I' && +s.sem === 6){ s.sem = 7; s.name = 'Seminario Trabajo de Grado por Orientación'; if(!s.mod) s.mod = 'PI'; s.ref = '7|' + s.name; }
      else if(s.status === 'pen' && s.name === 'Seminario de TFG II' && +s.sem === 7){ s.sem = 8; s.name = 'Seminario Trabajo de Grado por Orientación'; if(!s.mod) s.mod = 'PI'; s.ref = '8|' + s.name; }
    });
    d.v = 4;
  }
  d.subjects.forEach(s => {
    ['p1','p2','fin','exam'].forEach(k => { if(!GRADES.includes(s[k])) s[k] = ''; });
    if(FAIL.includes(s.p1)){ s.p2 = ''; s.fin = ''; } else if(FAIL.includes(s.p2)) s.fin = '';
    if(PASS.includes(s.fin)) s.exam = ''; s.orient = !!s.orient; s.ext = !!s.ext; s.inv = !!s.inv; s.prac = !!s.prac; s.tfg = !!s.tfg; s.tries = Math.max(0, Math.floor(+s.tries) || 0);
  });
  return d;
}

  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

function calc(){
  const subs = state.subjects, cfg = state.cfg;
  const ap = subs.filter(isAp);
  const byMod = {};
  MODS.forEach(m => byMod[m] = sum(ap.filter(s => s.mod === m)));
  const noMod = ap.filter(s => !s.mod);
  const cyc = {};
  let counted = 0;
  for(const k of Object.keys(CYCLES)){
    const items = ap.filter(s => cycleOf(+s.sem) === k);
    const obl = sum(items.filter(s => s.type === 'obl'));
    const opt = sum(items.filter(s => s.type !== 'obl'));
    const req = cfg.cycles[k];
    const c = Math.min(obl, req.obl) + Math.min(opt, req.opt);
    const pend = subs.filter(s => cycleOf(+s.sem) === k && s.type === 'obl' && !isAp(s)).map(s => s.name);
    const ori = sum(items.filter(s => s.type === 'opt' && isOri(s)));
    const oriReq = (cfg.orientMin && cfg.orientMin[k]) || 0;
    cyc[k] = {obl, opt, counted:c, req, pend, ori, oriReq};
    counted += c;
  }
  const inProgress = sum(subs.filter(s => s.status === 'cur' || s.status === 'ex'));
  return {byMod, noMod, cyc, counted, total:sum(ap), inProgress};
}

      ${v > t ? `<div class="sub">+${v - t} sobre el mínimo</div>` : ''}
    </div>`;
  }).join('');
  const modSum = MODS.reduce((t,m) => t + cfg.modules[m], 0);
  const modules = `<section class="card"><h2>Mínimos por módulo</h2><div class="grid">${mods}</div>
    <p class="sub">Los mínimos de módulo suman ${modSum} de ${cfg.total} créditos; el resto (${Math.max(0, cfg.total - modSum)}) puede venir de cualquier módulo.</p></section>`;

  const cycles = Object.keys(CYCLES).map(k => {
    const d = c.cyc[k], r = d.req;
    return `<div class="cyc">
      <div class="hd"><b>${CYCLES[k].name}</b><span class="sub" style="margin:0">${CYCLES[k].sems} · ${d.counted} / ${r.total}</span></div>
      <div class="two">
        <div><div class="lbl"><span>Obligatorias</span><span>${d.obl} / ${r.obl}</span></div><div class="bar"><i style="width:${pct(d.obl, r.obl)}%"></i></div></div>
        <div><div class="lbl"><span>Optativas y electivas</span><span>${d.opt} / ${r.opt}</span></div><div class="bar"><i style="width:${pct(d.opt, r.opt)}%"></i></div></div>
      </div>
      ${d.opt > r.opt ? `<div class="sub">Tenés ${d.opt - r.opt} cr de optativas por encima de lo que pide este ciclo.</div>` : ''}
      ${d.oriReq ? `<div style="margin-top:10px"><div class="lbl"><span>Optativas de tu orientación</span><span>${d.ori} / ${d.oriReq}</span></div><div class="bar"><i style="width:${pct(d.ori, d.oriReq)}%"></i></div></div>` : ''}
      ${d.pend.length ? `<div class="sub">Obligatorias pendientes: ${d.pend.map(esc).join(', ')}.</div>` : ''}
    </div>`;
  }).join('');

  return alert + hero + reqCard() + orientCard() + modules + `<section class="card"><h2>Avance por ciclo</h2>${cycles}</section>`;
}

function gradesLine(s){

function applyLocks(src){
  const g = k => document.getElementById('f-' + k);
  const failP1 = FAIL.includes(g('p1').value);
  const failP2 = FAIL.includes(g('p2').value);
  const toExam = failP1 || failP2;
  g('p2').disabled = failP1; g('fin').disabled = toExam;
  if(failP1) g('p2').value = '';
  if(toExam){ g('fin').value = ''; g('fin').dataset.auto = ''; }
  if(src === 'p1' || src === 'p2'){
    const a = g('p1').value, b = g('p2').value, fn = g('fin');
    if(!failP1 && a && a === b && PASS.includes(a)){ fn.value = a; fn.dataset.auto = '1'; }
    else if(fn.dataset.auto === '1'){ fn.value = ''; fn.dataset.auto = ''; }
  }
  if(src === 'fin') g('fin').dataset.auto = '';
  const passFin = PASS.includes(g('fin').value);
  g('exam').disabled = passFin;
  if(passFin) g('exam').value = '';
  if(src){
    const ex = g('exam').value, fv = g('fin').value, st = g('status');
    if(PASS.includes(ex)) st.value = 'exa';
    else if(PASS.includes(fv)) st.value = 'ap';
    else if(FAIL.includes(fv) || FAIL.includes(ex) || toExam) st.value = 'ex';
    const tc = document.getElementById('f-tries');
    if(src === 'exam' && ex && !(+tc.textContent)) tc.textContent = 1;
  }
  const tn = +document.getElementById('f-tries').textContent || 0, sv = g('status').value;
  document.getElementById('tries-row').hidden = !(toExam || FAIL.includes(g('fin').value) || g('exam').value || tn > 0 || sv === 'ex' || sv === 'exa');
}

/* ---------- SINCRONIZACION ---------- */
const SYNC_MSG = {
  connecting:'Conectando con tu cuenta…',
  local:'Guardado solo en este dispositivo',
  saving:'Sincronizando…',
  ok:'Sincronizado con tu cuenta',
  error:'No se pudo sincronizar; tus datos siguen guardados en este dispositivo'
};
let sync = {ref:null, status:'connecting', timer:null, busy:false, dirty:false, conflict:null, retried:false};
let pendingRemote = null;
const clone = x => JSON.parse(JSON.stringify(x));
function paintSync(){ const el = document.getElementById('syncstat'); if(el) el.textContent = SYNC_MSG[sync.status] || ''; }
function setStatus(s){ sync.status = s; paintSync(); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function conflictBanner(){
  if(!sync.conflict) return '';
  return `<div class="alert"><b>Hay datos distintos en tu cuenta y en este dispositivo.</b> ¿Cuáles querés usar?
    <div class="acts" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-act="useRemote">Usar los de mi cuenta</button><button class="btn" data-act="useLocal">Usar los de este dispositivo</button></div></div>`;
}
function schedulePush(){
  if(!sync.ref) return;
  sync.dirty = true; clearTimeout(sync.timer); sync.timer = setTimeout(flush, 800);
}
async function flush(){
  if(!sync.ref || sync.busy || !sync.dirty) return;
  sync.busy = true; sync.dirty = false; setStatus('saving');
  try{
    await sync.ref.set({state:clone(state), ts:state.ts});
    sync.retried = false; setStatus('ok');
  }catch(e){
    const code = e && e.code;
    if(code === 'unavailable' && !sync.retried){ sync.retried = true; sync.dirty = true; setTimeout(flush, 4000); setStatus('error'); }
    else if(code === 'invalid_argument'){ setStatus('local'); }
    else setStatus('error');
  }
  sync.busy = false;
  if(sync.dirty && sync.status !== 'error') flush();
}
function applyRemote(r){
  state = clean(clone(r.state)); state.ts = r.ts;
  persist(); render(); setStatus('ok'); toast('Datos actualizados desde otro dispositivo');
}
function adopt(r){ if($dlg.open){ pendingRemote = r; return; } applyRemote(r); }
const slim = x => JSON.stringify({c:x.cfg, s:x.subjects, o:x.orientation || ''});
function remoteCheck(r, initial){
  if(!r || !r.state || !Array.isArray(r.state.subjects) || !r.state.cfg) return;
  if(sync.conflict){ sync.conflict = r; return; }
  const rts = +r.ts || 0, lts = +state.ts || 0;
  if(initial && hadLocal && !lts){
    if(slim(clean(clone(r.state))) === slim(state)){ state.ts = rts; persist(); setStatus('ok'); return; }
    sync.conflict = r; render(); return;
  }
  if(rts > lts) adopt(r);
  else if(rts < lts) schedulePush();
  else if(!sync.busy) setStatus('ok');
}
async function initSync(){
  try{
    if(!window.claude || !window.claude.use){ setStatus('local'); return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user){ setStatus('local'); return; }
    const uid = await user.id();
    if(!uid){ setStatus('local'); return; }
    sync.ref = db.collection('data/users/' + uid).doc('carrera');
    const snap = await sync.ref.get();
    if(snap.exists){ remoteCheck(snap.data(), true); }
    else if(hadLocal || state.ts){
      if(!state.ts){ state.ts = Date.now(); persist(); }
      schedulePush();
    } else setStatus('ok');
    if(sync.status === 'connecting') setStatus('ok');
    sync.ref.onSnapshot(s => { if(s.exists) remoteCheck(s.data(), false); }, () => setStatus('error'));
  }catch(e){ setStatus('local'); }
}
$dlg.addEventListener('input', e => { if(e.target.id === 'pk-q'){ ui.pick.q = e.target.value; paintPickList(); } });
$dlg.addEventListener('change', e => {
  if(e.target.id === 'pk-cat'){ ui.pick.cat = e.target.value; paintPickList(); }
  else if(e.target.id === 'pk-flt'){ ui.pick.flt = e.target.value; paintPickList(); }
});
$dlg.addEventListener('close', () => {
  if(pendingRemote){ const r = pendingRemote; pendingRemote = null; if((+r.ts || 0) > (+state.ts || 0)) applyRemote(r); }
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden && sync.dirty){ clearTimeout(sync.timer); flush(); }
});
initSync();

render();
</script>
</body>
</html>
